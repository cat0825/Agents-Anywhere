name: Windows IPC follow-up (fork only)

on:
  push:
    branches:
      - chore/dsk/windows-spaced-paths-validation

permissions:
  contents: read

jobs:
  windows-ipc:
    if: github.repository == 'cat0825/Agents-Anywhere'
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
        working-directory: Smoke Workspace/Agents Anywhere/desktop-workbench
    env:
      YARN_ENABLE_IMMUTABLE_INSTALLS: 'false'
      YARN_ENABLE_SCRIPTS: 'false'
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Check out exact PR 348 head under a path containing spaces
        uses: actions/checkout@v6
        with:
          ref: a5814e50347d391cf2adf02ffafc97ce0257ebd8
          path: Smoke Workspace/Agents Anywhere
      - name: Set up project-supported Node
        uses: actions/setup-node@v6
        with:
          node-version: '22.23.2'
      - name: Put Node and Corepack under a path containing spaces
        run: |
          $nodeSource = Split-Path (Get-Command node).Source
          $nodeRoot = Join-Path $env:RUNNER_TEMP 'Node With Spaces'
          Copy-Item -LiteralPath $nodeSource -Destination $nodeRoot -Recurse
          $env:PATH = "$nodeRoot;$env:PATH"
          $nodeRoot | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          node -p 'JSON.stringify({version:process.version,execPath:process.execPath,cwd:process.cwd()})'
          corepack enable
          if ($LASTEXITCODE -ne 0) { throw 'Corepack setup failed' }
      - name: Install declared dependencies
        run: |
          corepack yarn install
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
      - name: Run all desktop tests including the original failing IPC case
        run: |
          corepack yarn test:main
          if ($LASTEXITCODE -ne 0) { throw 'Desktop tests failed' }
      - name: Renderer typecheck
        run: |
          corepack yarn renderer:typecheck
          if ($LASTEXITCODE -ne 0) { throw 'Renderer typecheck failed' }
