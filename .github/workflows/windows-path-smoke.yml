name: Windows spaced-path smoke (fork only)

on:
  push:
    branches:
      - chore/dsk/windows-spaced-paths-validation

permissions:
  contents: read

jobs:
  windows-smoke:
    if: github.repository == 'cat0825/Agents-Anywhere'
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
        working-directory: Smoke Workspace/Agents Anywhere/desktop-workbench
    env:
      YARN_ENABLE_IMMUTABLE_INSTALLS: 'false'
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      NEXT_TELEMETRY_DISABLED: '1'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Check out exact PR 350 head under a path containing spaces
        uses: actions/checkout@v6
        with:
          ref: 43cc84fc2c821fb554e561f73e753ff0b86f9ec3
          path: Smoke Workspace/Agents Anywhere
      - name: Set up project-supported Node
        uses: actions/setup-node@v6
        with:
          node-version: '22.23.2'
      - name: Put Node and Corepack under a path containing spaces
        run: |
          $nodeSource = Split-Path (Get-Command node).Source
          $nodeRoot = Join-Path $env:RUNNER_TEMP 'Node With Spaces'
          Copy-Item -LiteralPath $nodeSource -Destination $nodeRoot -Recurse
          $env:PATH = "$nodeRoot;$env:PATH"
          $nodeRoot | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          node -p 'JSON.stringify({version:process.version,execPath:process.execPath,cwd:process.cwd()})'
          corepack enable
          if ($LASTEXITCODE -ne 0) { throw 'Corepack setup failed' }
      - name: Install declared dependencies
        run: |
          corepack yarn install
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
      - name: Desktop tests on exact PR head
        id: tests
        continue-on-error: true
        run: |
          corepack yarn test:main
          if ($LASTEXITCODE -ne 0) { throw 'Desktop tests failed' }
      - name: Renderer typecheck on exact PR head
        id: types
        continue-on-error: true
        run: |
          corepack yarn renderer:typecheck
          if ($LASTEXITCODE -ne 0) { throw 'Renderer typecheck failed' }
      - name: Build Windows package using spaced Node and checkout paths
        run: |
          node scripts/dist-desktop.mjs win --dir
          $dirExit = $LASTEXITCODE
          if ($dirExit -ne 0) {
            $app = Join-Path (Get-Location) 'release/win-unpacked/Agents Anywhere.exe'
            if (!(Test-Path -LiteralPath $app)) { throw "Directory packaging failed with exit $dirExit" }
            Write-Output "Directory package exists at $app, but dist entry point exited $dirExit; checking installer mode separately."
            node scripts/dist-desktop.mjs win --skip-build
            if ($LASTEXITCODE -ne 0) { throw 'Installer packaging failed' }
          }
          $installers = @(Get-ChildItem -LiteralPath 'release' -Filter '*.exe')
          $apps = @(Get-ChildItem -LiteralPath 'release/win-unpacked' -Filter 'Agents Anywhere.exe' -ErrorAction SilentlyContinue)
          if (($installers.Count + $apps.Count) -eq 0) { throw 'No executable artifact was produced' }
          $installers + $apps | Select-Object FullName, Length | Format-Table
      - name: Preserve test outcomes
        if: always()
        run: |
          "Desktop tests: ${{ steps.tests.outcome }}" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "Renderer types: ${{ steps.types.outcome }}" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          if ('${{ steps.tests.outcome }}' -ne 'success' -or '${{ steps.types.outcome }}' -ne 'success') {
            throw 'At least one headless verification failed; see individual step logs.'
          }
